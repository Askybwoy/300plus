<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Design Illustration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .illustration-container {
      width: 100%;
      max-width: 380px;
    }

    /* Design showcase card */
    .design-card {
      background: #1A1A1A;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    .design-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Typography showcase */
    .typo-showcase {
      position: relative;
      margin-bottom: 16px;
    }

    .typo-large {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 1;
      letter-spacing: -1px;
    }

    .typo-large .accent {
      color: #FF6B00;
    }

    .typo-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 6px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Font specimen row */
    .font-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .font-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 56px;
      flex-shrink: 0;
    }

    .font-sample-serif {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 500;
      color: #FFFFFF;
    }

    .font-sample-sans {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Color palette row */
    .palette-section {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 2px;
    }

    .palette-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .palette-row {
      display: flex;
      gap: 8px;
    }

    .swatch {
      flex: 1;
      height: 28px;
      border-radius: 8px;
      position: relative;
    }

    .swatch-dark { background: #1A1A1A; border: 1px solid rgba(255, 255, 255, 0.12); }
    .swatch-gray { background: #F5F5F5; }
    .swatch-orange { background: #FF6B00; }
    .swatch-white { background: #FFFFFF; }

    /* Animated accent dot */
    .accent-dot {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 12px;
      height: 12px;
      background: #22C55E;
      border-radius: 50%;
      border: 2px solid #1A1A1A;
    }

    /* Component preview card */
    .components-single {
      margin-top: 12px;
    }

    .comp-card-large {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .comp-content {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    /* Left: 2x2 grid section */
    .comp-grid-section {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-cell {
      aspect-ratio: 1;
      background: #F5F5F5;
      border-radius: 8px;
      position: relative;
    }

    .grid-cell.highlighted {
      background: rgba(255, 107, 0, 0.08);
      border: 1px dashed rgba(255, 107, 0, 0.3);
    }

    .grid-cell.highlighted::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: #FF6B00;
      border-radius: 2px;
      opacity: 0.6;
    }

    /* Right: preview section */
    .comp-preview-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comp-card-mockup {
      background: #F5F5F5;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mockup-line {
      height: 4px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 2px;
    }

    .mockup-line.thick {
      height: 6px;
      background: #1A1A1A;
      width: 70%;
    }

    .mockup-line.short {
      width: 50%;
    }

    .mockup-image {
      background: #F5F5F5;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .comp-label-large {
      display: block;
      text-align: center;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.5);
    }


  </style>
</head>
<body>

  <div class="illustration-container">
    <!-- Dark design showcase card -->
    <div class="design-card">
      <!-- Typography showcase -->
      <div class="typo-showcase">
        <div class="typo-large">Aa<span class="accent">.</span></div>
        <div class="typo-sub">Чистая типографика</div>
      </div>

      <!-- Font specimens -->
      <div class="font-row">
        <span class="font-label">Serif</span>
        <span class="font-sample-serif">Playfair Display</span>
      </div>
      <div class="font-row">
        <span class="font-label">Sans</span>
        <span class="font-sample-sans">Inter — body & UI</span>
      </div>

      <!-- Color palette -->
      <div class="palette-section">
        <div class="palette-label">Палитра</div>
        <div class="palette-row">
          <div class="swatch swatch-dark"></div>
          <div class="swatch swatch-gray"></div>
          <div class="swatch swatch-orange">
            <div class="accent-dot"></div>
          </div>
          <div class="swatch swatch-white"></div>
        </div>
      </div>
    </div>

    <!-- Component preview card -->
    <div class="components-single">
      <div class="comp-card-large">
        <div class="comp-content">
          <!-- Left: 2x2 grid -->
          <div class="comp-grid-section">
            <div class="grid-cell highlighted"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell highlighted"></div>
          </div>
          <!-- Right: card preview -->
          <div class="comp-preview-section">
            <div class="comp-card-mockup">
              <div class="mockup-line thick"></div>
              <div class="mockup-line"></div>
              <div class="mockup-line short"></div>
            </div>
            <div class="mockup-image">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="18" height="18" rx="4" stroke="#FF6B00" stroke-width="1.5" fill="none"/>
                <circle cx="8.5" cy="8.5" r="2" stroke="#FF6B00" stroke-width="1.5" fill="none"/>
                <path d="M3 15L8 10L13 15L21 7" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
        <span class="comp-label-large">Акценты</span>
      </div>
    </div>


  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
