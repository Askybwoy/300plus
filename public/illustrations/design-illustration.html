<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Design Illustration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .illustration-container {
      width: 100%;
      max-width: 380px;
    }

    /* Design showcase card */
    .design-card {
      background: #1A1A1A;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    .design-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Typography showcase */
    .typo-showcase {
      position: relative;
      margin-bottom: 16px;
    }

    .typo-large {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 1;
      letter-spacing: -1px;
    }

    .typo-large .accent {
      color: #FF6B00;
    }

    .typo-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 6px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Font specimen row */
    .font-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .font-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 56px;
      flex-shrink: 0;
    }

    .font-sample-serif {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 500;
      color: #FFFFFF;
    }

    .font-sample-sans {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Color palette row */
    .palette-section {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 2px;
    }

    .palette-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .palette-row {
      display: flex;
      gap: 8px;
    }

    .swatch {
      flex: 1;
      height: 28px;
      border-radius: 8px;
      position: relative;
    }

    .swatch-dark { background: #1A1A1A; border: 1px solid rgba(255, 255, 255, 0.12); }
    .swatch-gray { background: #F5F5F5; }
    .swatch-orange { background: #FF6B00; }
    .swatch-white { background: #FFFFFF; }

    /* Animated accent dot */
    .accent-dot {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 12px;
      height: 12px;
      background: #22C55E;
      border-radius: 50%;
      border: 2px solid #1A1A1A;
    }

    /* Component preview cards below the dark card */
    .components-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .comp-card {
      flex: 1;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Button component preview */
    .comp-btn-preview {
      width: 100%;
      height: 32px;
      background: #FF6B00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .comp-btn-preview::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      animation: shimmer 3s ease infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    .comp-btn-text {
      width: 48px;
      height: 6px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 2px;
    }

    /* Card component preview */
    .comp-card-preview {
      width: 100%;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comp-card-line {
      height: 5px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.08);
    }

    .comp-card-line:first-child {
      width: 60%;
      height: 6px;
      background: #1A1A1A;
    }

    .comp-card-line:nth-child(2) {
      width: 90%;
    }

    .comp-card-line:nth-child(3) {
      width: 40%;
    }

    .comp-label {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.4);
    }

    /* Spacing / grid preview */
    .comp-grid-preview {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    .grid-cell {
      aspect-ratio: 1.2;
      background: rgba(0, 0, 0, 0.04);
      border-radius: 5px;
      position: relative;
    }

    .grid-cell.highlighted {
      background: rgba(255, 107, 0, 0.08);
      border: 1px dashed rgba(255, 107, 0, 0.3);
    }

    .grid-cell.highlighted::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: #FF6B00;
      border-radius: 2px;
      opacity: 0.4;
    }

    /* Animation preview — easing curve */
    .anim-preview {
      width: 100%;
      height: 40px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .easing-curve {
      width: 100%;
      height: 36px;
    }

    .easing-curve svg {
      width: 100%;
      height: 100%;
    }

    .easing-dot {
      animation: move-along 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes move-along {
      0% { cx: 8; cy: 32; }
      50% { cx: 60; cy: 6; }
      100% { cx: 112; cy: 32; }
    }

    /* Title section */
    .title-section {
      margin-top: 36px;
    }

    .title-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.15;
      color: #1A1A1A;
      margin-bottom: 12px;
    }

    .title-section p {
      font-size: 15px;
      line-height: 1.55;
      color: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="illustration-container">
    <!-- Dark design showcase card -->
    <div class="design-card">
      <!-- Typography showcase -->
      <div class="typo-showcase">
        <div class="typo-large">Aa<span class="accent">.</span></div>
        <div class="typo-sub">Clean typography</div>
      </div>

      <!-- Font specimens -->
      <div class="font-row">
        <span class="font-label">Serif</span>
        <span class="font-sample-serif">Playfair Display</span>
      </div>
      <div class="font-row">
        <span class="font-label">Sans</span>
        <span class="font-sample-sans">Inter — body & UI</span>
      </div>

      <!-- Color palette -->
      <div class="palette-section">
        <div class="palette-label">Палитра</div>
        <div class="palette-row">
          <div class="swatch swatch-dark"></div>
          <div class="swatch swatch-gray"></div>
          <div class="swatch swatch-orange">
            <div class="accent-dot"></div>
          </div>
          <div class="swatch swatch-white"></div>
        </div>
      </div>
    </div>

    <!-- Component previews row -->
    <div class="components-row">
      <!-- Button + animation -->
      <div class="comp-card">
        <div class="comp-btn-preview">
          <div class="comp-btn-text"></div>
        </div>
        <div class="anim-preview">
          <div class="easing-curve">
            <svg viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 8 32 C 30 32, 28 6, 60 6 C 92 6, 90 32, 112 32" stroke="rgba(0,0,0,0.1)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M 8 32 C 30 32, 28 6, 60 6 C 92 6, 90 32, 112 32" stroke="#FF6B00" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="160">
                <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" repeatCount="indefinite"/>
              </path>
              <circle r="3" fill="#FF6B00" class="easing-dot">
                <animateMotion dur="2.4s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.4 0 0.2 1" calcMode="spline">
                  <mpath href="#curve-path"/>
                </animateMotion>
              </circle>
              <path id="curve-path" d="M 8 32 C 30 32, 28 6, 60 6 C 92 6, 90 32, 112 32" fill="none"/>
            </svg>
          </div>
        </div>
        <span class="comp-label">Анимация</span>
      </div>

      <!-- Layout grid -->
      <div class="comp-card">
        <div class="comp-grid-preview">
          <div class="grid-cell highlighted"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell highlighted"></div>
        </div>
        <div class="comp-card-preview">
          <div class="comp-card-line"></div>
          <div class="comp-card-line"></div>
          <div class="comp-card-line"></div>
        </div>
        <span class="comp-label">Акценты</span>
      </div>
    </div>

    <!-- Title section -->
    <div class="title-section">
      <h1>Современный<br>дизайн</h1>
      <p>Следим за трендами и применяем актуальные визуальные решения: чистую типографику, грамотные акценты и продуманную анимацию</p>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
