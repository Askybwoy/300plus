<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Step Illustration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .illustration-container {
      width: 100%;
      max-width: 380px;
    }

    /* Video call card */
    .call-card {
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0, 0, 0, 0.07);
      border: 1px solid rgba(0, 0, 0, 0.06);
      margin-bottom: 40px;
    }

    /* Call header */
    .call-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .call-timer {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      background: #EF4444;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timer-text {
      font-size: 14px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: #1A1A1A;
    }

    .call-duration-label {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.4);
      background: rgba(0, 0, 0, 0.04);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Video grid */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: rgba(0, 0, 0, 0.04);
    }

    .video-tile {
      position: relative;
      aspect-ratio: 4/3;
      background: linear-gradient(180deg, #F7F7F7 0%, #EDEDED 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .video-tile .person-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-tile .person-icon.agency {
      background: #FF6B00;
    }

    .video-tile .person-icon.client {
      background: linear-gradient(135deg, #E8E8E8 0%, #D0D0D0 100%);
    }

    .video-tile .person-icon svg {
      width: 22px;
      height: 22px;
    }

    .video-tile .person-icon.agency svg {
      color: white;
    }

    .video-tile .person-icon.client svg {
      color: rgba(0, 0, 0, 0.35);
    }

    .video-tile .person-name {
      font-size: 12px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.6);
    }

    /* Speaking indicator */
    .speaking-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #FF6B00;
      opacity: 0;
      animation: speak 2s ease-in-out infinite;
    }

    @keyframes speak {
      0%, 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
      30% { opacity: 0.5; transform: translate(-50%, -60%) scale(1.15); }
      60% { opacity: 0; transform: translate(-50%, -60%) scale(1.3); }
    }

    /* Call controls */
    .call-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.04);
    }

    .ctrl-btn svg {
      width: 18px;
      height: 18px;
      color: rgba(0, 0, 0, 0.5);
    }

    .ctrl-btn.end-call {
      background: #EF4444;
      width: 48px;
      height: 40px;
      border-radius: 14px;
    }

    .ctrl-btn.end-call svg {
      color: white;
    }

    /* Task card below */
    .task-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.06);
      max-width: 260px;
      margin-left: auto;
    }

    .task-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-check {
      width: 18px;
      height: 18px;
      background: #22C55E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-check svg {
      width: 10px;
      height: 10px;
      color: white;
    }

    .status-text {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.5);
    }

    .task-card-time {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.35);
      margin-left: auto;
    }

    .task-title {
      font-size: 15px;
      font-weight: 500;
      color: #1A1A1A;
      margin-bottom: 4px;
    }

    .task-project {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.45);
    }

    /* Title section */
    .title-section {
      margin-top: 48px;
    }

    .title-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.15;
      color: #1A1A1A;
      margin-bottom: 16px;
    }

    .title-section p {
      font-size: 15px;
      line-height: 1.55;
      color: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="illustration-container">
    <!-- Video call card -->
    <div class="call-card">
      <div class="call-header">
        <div class="call-timer">
          <span class="rec-dot"></span>
          <span class="timer-text">47:23</span>
        </div>
        <span class="call-duration-label">1 час</span>
      </div>

      <div class="video-grid">
        <!-- Agency -->
        <div class="video-tile">
          <div class="speaking-ring"></div>
          <div class="person-icon agency">
            <i data-lucide="user" stroke-width="2"></i>
          </div>
          <span class="person-name">Вы</span>
        </div>

        <!-- Client -->
        <div class="video-tile">
          <div class="person-icon client">
            <i data-lucide="user" stroke-width="2"></i>
          </div>
          <span class="person-name">Клиент</span>
        </div>
      </div>

      <div class="call-controls">
        <div class="ctrl-btn">
          <i data-lucide="mic" stroke-width="1.5"></i>
        </div>
        <div class="ctrl-btn">
          <i data-lucide="video" stroke-width="1.5"></i>
        </div>
        <div class="ctrl-btn end-call">
          <i data-lucide="phone-off" stroke-width="1.5"></i>
        </div>
        <div class="ctrl-btn">
          <i data-lucide="monitor" stroke-width="1.5"></i>
        </div>
      </div>
    </div>

    <!-- Task card -->
    <div class="task-card">
      <div class="task-status">
        <div class="status-check">
          <i data-lucide="check" stroke-width="3"></i>
        </div>
        <span class="status-text">Этап завершён</span>
        <span class="task-card-time">15:00</span>
      </div>
      <div class="task-title">Интервью с клиентом</div>
      <div class="task-project">Создание лендинга</div>
    </div>

    <!-- Title section -->
    <div class="title-section">
      <h1>Понимаем бизнес<br>до первого пикселя</h1>
      <p>Часовой созвон, чтобы разобраться в продукте, аудитории и целях рекламной кампании</p>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
