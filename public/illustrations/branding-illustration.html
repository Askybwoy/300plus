<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand + Landing Illustration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .illustration-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 48px;
      max-width: 800px;
    }

    /* Main dark card */
    .project-card {
      width: 340px;
      background: #1A1A1A;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
    }

    /* Project header info */
    .project-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-value {
      font-size: 14px;
      font-weight: 500;
      color: #FFFFFF;
    }

    /* Service items */
    .services-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .service-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-radius: 16px;
      transition: transform 0.2s ease;
    }

    .service-item:hover {
      transform: translateX(4px);
    }

    /* Dark variant */
    .service-item.dark {
      background: #2A2A2A;
    }

    .service-item.dark .service-name {
      color: #FFFFFF;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 500;
    }

    .service-item.dark .arrow-btn {
      width: 36px;
      height: 36px;
      background: #FF6B00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-item.dark .arrow-btn svg {
      width: 16px;
      height: 16px;
      color: white;
    }

    /* Orange variant */
    .service-item.orange {
      background: #FF6B00;
    }

    .service-item.orange .service-name {
      color: #FFFFFF;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 500;
    }

    .service-item.orange .arrow-btn {
      width: 36px;
      height: 36px;
      background: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-item.orange .arrow-btn svg {
      width: 16px;
      height: 16px;
      color: #FF6B00;
    }

    /* Light variant */
    .service-item.light {
      background: #FFFFFF;
    }

    .service-item.light .service-name {
      color: #1A1A1A;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 500;
    }

    .service-item.light .arrow-btn {
      width: 36px;
      height: 36px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-item.light .arrow-btn svg {
      width: 16px;
      height: 16px;
      color: #FF6B00;
    }

    /* Right content section */
    .content-section {
      max-width: 320px;
      padding-top: 12px;
    }

    .content-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.15;
      color: #1A1A1A;
      margin-bottom: 16px;
    }

    .content-section p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(0, 0, 0, 0.6);
      margin-bottom: 40px;
    }

    /* Metric */
    .metric-section {
      margin-top: 32px;
    }

    .metric-label {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.45);
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 48px;
      font-weight: 500;
      color: #FF6B00;
      line-height: 1;
    }

    .metric-value span {
      font-size: 32px;
    }

    /* Progress indicator */
    .progress-bar {
      display: flex;
      gap: 6px;
      margin-top: 24px;
    }

    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.1);
    }

    .progress-dot.active {
      background: #FF6B00;
      width: 24px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="illustration-wrapper">
    <!-- Dark project card -->
    <div class="project-card">
      <!-- Header info -->
      <div class="project-header">
        <div class="header-item">
          <span class="header-label">Клиент</span>
          <span class="header-value">Startup Pro</span>
        </div>
        <div class="header-item">
          <span class="header-label">Бюджет</span>
          <span class="header-value">$3,200</span>
        </div>
        <div class="header-item">
          <span class="header-label">Дней</span>
          <span class="header-value">14</span>
        </div>
      </div>

      <!-- Services list -->
      <div class="services-list">
        <div class="service-item dark">
          <span class="service-name">Айдентика<br>бренда</span>
          <div class="arrow-btn">
            <i data-lucide="arrow-right" stroke-width="2"></i>
          </div>
        </div>

        <div class="service-item orange">
          <span class="service-name">Лендинг<br>под рекламу</span>
          <div class="arrow-btn">
            <i data-lucide="arrow-right" stroke-width="2"></i>
          </div>
        </div>

        <div class="service-item light">
          <span class="service-name">Рекламные<br>креативы</span>
          <div class="arrow-btn">
            <i data-lucide="arrow-right" stroke-width="2"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Right content -->
    <div class="content-section">
      <h1>Бренд +<br>Лендинг</h1>
      <p>Создаём айдентику и посадочную страницу, готовим материалы для рекламы — всё за две недели</p>

      <div class="metric-section">
        <div class="metric-label">готовность к запуску рекламы</div>
        <div class="metric-value">2<span>×</span></div>
        <div class="metric-label" style="margin-top: 4px;">быстрее стандартных сроков</div>
      </div>

      <div class="progress-bar">
        <div class="progress-dot"></div>
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
